<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="luggage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Luggage handle -->
  <path d="M 200 140 L 200 100 C 200 84 212 72 228 72 L 284 72 C 300 72 312 84 312 100 L 312 140" 
        fill="none" stroke="#e0e7ff" stroke-width="20" stroke-linecap="round" />

  <!-- Main Luggage Body -->
  <g filter="url(#shadow)">
    <rect x="110" y="130" width="292" height="310" rx="40" fill="url(#luggage)" />
    <!-- Straps / Ribs -->
    <rect x="175" y="130" width="22" height="310" fill="#0369a1" opacity="0.4" rx="6" />
    <rect x="315" y="130" width="22" height="310" fill="#0369a1" opacity="0.4" rx="6" />
    <rect x="110" y="270" width="292" height="12" fill="#0c4a6e" opacity="0.3" />
    
    <!-- Wheels -->
    <rect x="150" y="430" width="40" height="26" rx="10" fill="#1e293b" />
    <rect x="322" y="430" width="40" height="26" rx="10" fill="#1e293b" />
  </g>

  <!-- Checkmark Badge on front of suitcase -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="285" r="58" fill="url(#badge)" stroke="#ffffff" stroke-width="8" />
    <path d="M 232 285 L 249 302 L 282 268" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Vacation plane decorative icon in top corner -->
  <path d="M 370 85 L 420 100 L 415 115 L 390 110 L 375 130 L 360 125 L 370 105 L 350 100 Z" fill="#fde047" opacity="0.9" />
</svg>
